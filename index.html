<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#24163d"><title>Factor Quest — The Lost Constellations</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7eeff;background:#130f28}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 5%,#45306a,transparent 40%),#130f28;min-height:100vh}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}.wrap{max-width:860px;margin:auto;padding:18px 14px 60px}.hero{position:relative;overflow:hidden;border:1px solid #9d80cc60;border-radius:26px;padding:26px;background:linear-gradient(118deg,#35225d,#56377e 60%,#9c569e);min-height:225px;box-shadow:0 20px 50px #07041577}.title{font-size:clamp(32px,6vw,51px);font-weight:900;letter-spacing:-1.5px;line-height:1.05}.over{font-size:12px;letter-spacing:2px;font-weight:800;color:#f6c6ee}.sub{max-width:440px;line-height:1.6;color:#f2defb;font-size:14px}.moon{position:absolute;width:180px;height:180px;right:-45px;top:-50px;border-radius:50%;background:#ddb4ee5a;box-shadow:0 0 90px #ffc4e74d}.land{position:absolute;width:320px;height:125px;right:-45px;bottom:-85px;background:#8283c6;border-radius:50%;transform:rotate(-18deg);box-shadow:0 0 60px #d7acfa88}.astronaut{position:absolute;right:16%;bottom:32px;font-size:75px;filter:drop-shadow(0 10px 7px #1c0f38);animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-12px)}}.spark{position:absolute;color:#fef1a4;animation:blink 3s infinite alternate}@keyframes blink{to{opacity:.2;transform:scale(.6)}}.worlds{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin:16px 0}.world{background:#251c43;border:1px solid #594675;border-radius:12px;padding:12px 2px;text-align:center;font-size:11px;color:#d0bede}.world b{display:block;font-size:23px;margin-bottom:4px}.world.active{border:2px solid #dfb6ff;background:#493368;color:white}.world.completed{border-color:#44c9ad}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:16px}.stat{border:1px solid #4d3a6c;background:#241a3e;border-radius:14px;padding:12px;text-align:center}.stat small{display:block;font-size:11px;letter-spacing:.5px;color:#c8b2e3}.stat strong{font-size:24px}.panel{background:#211934;border:1px solid #56446d;border-radius:20px;padding:clamp(17px,4vw,29px);box-shadow:0 18px 35px #09061955}.progress-line{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700}.bar{margin:10px 0 20px;height:10px;background:#3d3155;border-radius:20px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#4dd6b9,#b99cf9,#ff87c4);transition:width .3s}.eyebrow{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:#d5b2ff;font-weight:800;letter-spacing:.4px}.problem{font:700 clamp(30px,7vw,46px) Georgia,serif;text-align:center;padding:23px 0 24px;overflow-wrap:anywhere}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:#352749;border:1px solid #67547c;border-radius:13px;color:#fff;padding:15px 8px;min-height:74px;font:21px Georgia,serif;overflow-wrap:anywhere}.choice.active{outline:2px solid #d19dfb}.choice.correct{border:2px solid #58d4b8;background:#174c48}.textanswer{width:100%;padding:15px;background:#352749;border:1px solid #80669a;border-radius:12px;color:white;font:21px Georgia,serif}.help{font-size:12px;color:#bfaed1;margin:12px 0}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:13px 18px;color:white;font-weight:800;background:linear-gradient(100deg,#8255e9,#d447a2)}.alt{background:#443554;border:1px solid #715c83}.feedback{margin-top:15px;border-left:4px solid #caa3ff;background:#34274b;padding:13px 15px;border-radius:9px;line-height:1.55;font-size:14px}.footer{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;color:#bdaed0;font-size:12px}.tiny-btn{border:1px solid #665676;color:#efdefc;background:#302442;border-radius:9px;padding:8px 10px;white-space:nowrap}.winning{margin-top:12px;padding:13px;background:#493168;border:1px solid #e2b7ff;border-radius:12px;text-align:center}.hidden{display:none!important}@media(max-width:440px){.astronaut{right:6%;font-size:58px}.hero{min-height:205px;padding:20px}.sub{max-width:70%}.world{font-size:9px;padding:9px 1px}.world b{font-size:19px}.choices{grid-template-columns:1fr}.choice{min-height:56px}.title{font-size:33px}}
</style></head>
<body><main class="wrap"><header class="hero"><div class="moon"></div><div class="land"></div><span class="spark" style="top:20%;left:75%">✦</span><span class="spark" style="top:65%;left:63%">✧</span><span class="spark" style="top:15%;left:48%">✧</span><div class="astronaut">🧑🏽‍🚀</div><div style="position:relative;z-index:1"><p class="over">✦ AN ALGEBRA ADVENTURE</p><h1 class="title">FACTOR<br>QUEST ✧</h1><p class="sub">Restore the lost constellations. Every equation unlocks another piece of the universe.</p></div></header><div class="worlds" id="worlds"></div><div class="stats"><div class="stat"><small>STAR DUST</small><strong id="stars">0 ✦</strong></div><div class="stat"><small>STREAK</small><strong id="streak">0 🔥</strong></div><div class="stat"><small>ACCURACY</small><strong id="accuracy">100%</strong></div></div><div class="panel"><div class="progress-line"><span id="leveltitle"></span><span id="progress"></span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="eyebrow"><span id="kind"></span><span id="mode"></span></div><p style="font-weight:750;margin:21px 0 0">Factor completely:</p><div class="problem" id="problem"></div><div id="answers"></div><p class="help" id="help"></p><div class="buttons"><button class="btn" id="submit">Check answer ✦</button><button class="btn alt" id="hint">💡 Hint</button><button class="btn hidden" id="next">Next challenge →</button></div><div id="feedback" role="status" aria-live="polite"></div></div><div id="winning" class="winning hidden"></div><div class="footer"><span>Practice at your own pace. Your progress saves on this device.</span><button class="tiny-btn" id="reset">↻ Restart</button></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id), names=['The Launchpad','Sum Garden','Shadow Valley','Crystal Caverns','Orbit Station','The Star Citadel'],symbols=['🚀','🌸','🌙','💎','🪐','✨'];
const random=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, nz=(a,b)=>{let n=0;while(!n)n=random(a,b);return n},pick=a=>a[random(0,a.length-1)];
const mul=(a,b)=>{let r=Array(a.length+b.length-1).fill(0);a.forEach((x,i)=>b.forEach((y,j)=>r[i+j]+=x*y));return r};
const trim=a=>{while(a.length>1&&!a.at(-1))a.pop();return a};
function polynomial(c){let parts=[];for(let i=c.length-1;i>=0;i--){let v=c[i];if(!v)continue;let mag=Math.abs(v),term=(i&&mag===1?'':mag)+(i===2?'x²':i===1?'x':'');parts.push((parts.length?(v<0?' − ':' + '):(v<0?'−':''))+term)}return parts.join('')||'0'}
function linear(a,b){return (a===1?'x':a===-1?'−x':a+'x')+(b?(b<0?' − ':' + ')+Math.abs(b):'')};
const factor=(a,b)=>'('+linear(a,b)+')';
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
function generate(level){let a,b,c,d,k,p={};
 if(level===1){a=random(1,5);b=nz(-8,8);while(gcd(a,b)!==1)b=nz(-8,8);k=random(2,9);p.c=[k*b,k*a];p.f=k+factor(a,b);p.kind='GCF • BINOMIAL';p.hint='Find the greatest common factor. Divide every term by that number, then put the result inside parentheses.';p.why='Both terms share '+k+'. Factoring it out gives '+p.f+'.'}
 else if(level===2){a=random(1,9);b=random(1,9);p.c=[a*b,a+b,1];p.f=factor(1,a)+factor(1,b);p.kind='SIMPLE TRINOMIAL';p.hint='Look for two numbers that multiply to the constant term and add to the x coefficient.';p.why=a+' × '+b+' = '+a*b+' and '+a+' + '+b+' = '+(a+b)+'.'}
 else if(level===3){a=nz(-9,9);b=nz(-9,9);p.c=[a*b,a+b,1];p.f=factor(1,a)+factor(1,b);p.kind='SIGNED TRINOMIAL';p.hint='Two numbers must multiply to the constant and add to the middle coefficient. A negative product means opposite signs.';p.why='The numbers are '+a+' and '+b+': their product is '+a*b+' and their sum is '+(a+b)+'.'}
 else if(level===4){if(Math.random()<.6){a=random(2,10);b=random(1,10);while(gcd(a,b)!==1)b=random(1,10);p.c=[-b*b,0,a*a];p.f=factor(a,b)+factor(a,-b);p.kind='DIFFERENCE OF SQUARES';p.hint='Use A² − B² = (A + B)(A − B). Take the square root of both square terms.';p.why=a*a+'x² − '+b*b+' = ('+a+'x)² − ('+b+')².'}else{k=random(2,5);a=random(1,6);b=nz(-7,7);while(gcd(a,b)!==1)b=nz(-7,7);c=nz(-7,7);p.c=mul([b,a],[c,1]).map(x=>x*k);p.f=k+factor(a,b)+factor(1,c);p.kind='GCF + TRINOMIAL';p.hint='First remove the greatest common factor, then factor the trinomial left inside.';p.why='Pull out '+k+' first. The remaining factors are '+factor(a,b)+' and '+factor(1,c)+'.'}}
 else{a=random(2,level===5?4:6);c=random(1,level===5?3:5);b=nz(-7,7);d=nz(-7,7);while(gcd(a,b)!==1)b=nz(-7,7);while(gcd(c,d)!==1)d=nz(-7,7);k=level===6&&Math.random()<.4?random(2,3):1;p.c=mul([b,a],[d,c]).map(x=>x*k);p.f=(k>1?k:'')+factor(a,b)+factor(c,d);p.kind='ADVANCED TRINOMIAL';p.hint='For ax² + bx + c, the first terms of the binomials multiply to a and the last terms multiply to c. Use cross-products to verify the middle term.';p.why='The cross-products are '+(a*d)+' and '+(b*c)+', summing to '+(a*d+b*c)+'.'+(k>1?' First take out the common factor '+k+'.':'')}
 p.c=trim(p.c);p.question=polynomial(p.c);return p;
}
// Parse algebraic multiplication with parentheses, signed integers, x and exponents, without executing submitted code.
function parse(raw){let src=raw.replace(/−/g,'-').replace(/²/g,'^2').replace(/\s/g,'').toLowerCase(),tokens=src.match(/\d+|x|\^|[()+*\-]/g)||[];if(!src||tokens.join('')!==src||tokens.length>100)throw Error('syntax');let i=0;
 const add=(a,b,sign)=>trim(Array.from({length:Math.max(a.length,b.length)},(_,j)=>(a[j]||0)+sign*(b[j]||0)));
 function primary(){let t=tokens[i++];if(t==='('){let p=expr();if(tokens[i++]!==')')throw Error('parentheses');return p}if(t==='x')return[0,1];if(/^\d+$/.test(t||''))return[+t];if(t==='-')return primary().map(v=>-v);if(t==='+')return primary();throw Error('term')}
 function power(){let p=primary();if(tokens[i]==='^'){i++;let n=Number(tokens[i++]);if(!Number.isInteger(n)||n<0||n>3)throw Error('power');let out=[1];for(let j=0;j<n;j++)out=mul(out,p);return out}return p}
 function term(){let p=power();while(tokens[i]==='*'||tokens[i]==='('||tokens[i]==='x'||/^\d+$/.test(tokens[i]||'')){if(tokens[i]==='*')i++;p=mul(p,power())}return p}
 function expr(){let p=term();while(tokens[i]==='+'||tokens[i]==='-'){let sign=tokens[i++]==='-'?-1:1;p=add(p,term(),sign)}return p}
 let out=trim(expr());if(i!==tokens.length)throw Error('syntax');return out;
}
const equivalent=(answer,p)=>{try{let q=parse(answer);return q.length===p.c.length&&q.every((v,i)=>v===p.c[i])}catch{return false}};
// Factorizations must have multiplicative structure; simply copying the original expression does not count.
function factored(answer,p){if(!equivalent(answer,p))return false;let a=answer.replace(/\s/g,'').replace(/−/g,'-');if(!a.includes('(')||!a.includes(')'))return false;if(/^\(.*\)$/.test(a)&&!/^\d+\(/.test(a))return false;return true}
const save=()=>{try{localStorage.setItem('factorquest_v2',JSON.stringify({level:state.level,stars:state.stars,streak:state.streak,correct:state.correct,total:state.total,success:state.success,finished:state.finished}))}catch{}};
let saved={};try{saved=JSON.parse(localStorage.getItem('factorquest_v2'))||{}}catch{}
let state={level:Math.min(6,Math.max(1,saved.level||1)),stars:saved.stars||0,streak:saved.streak||0,correct:saved.correct||0,total:saved.total||0,success:saved.success||0,finished:!!saved.finished,tries:0,answered:false,selected:-1,problem:null,mode:'mc',choices:[]};
function choices(p){let answers=[p.f],round=0;while(answers.length<4&&round++<100){let altered=null;if(p.f.includes(')')){let m=[...p.f.matchAll(/(?:\+|−)\s*\d+(?=\))/g)];if(m.length){let found=pick(m),old=Number(found[0].replace(/−/g,'-').replace(/\s/g,'')),next=old+pick([-3,-2,-1,1,2,3]);altered=p.f.slice(0,found.index)+(next<0?' − ':' + ')+Math.abs(next)+p.f.slice(found.index+found[0].length)}}if(altered&&!answers.includes(altered)&&!equivalent(altered,p))answers.push(altered);if(answers.length<4){let v=factor(random(1,5),nz(-8,8))+factor(random(1,4),nz(-8,8));if(!answers.includes(v)&&!equivalent(v,p))answers.push(v)}}return answers.sort(()=>Math.random()-.5)}
function newProblem(){state.problem=generate(state.level);state.mode=state.total%2===0?'mc':'typed';state.choices=choices(state.problem);state.selected=-1;state.tries=0;state.answered=false;render()}
function message(title,body){$('feedback').innerHTML='';let box=document.createElement('div');box.className='feedback';let strong=document.createElement('strong');strong.textContent=title;box.append(strong);let detail=document.createElement('div');detail.style.marginTop='6px';detail.textContent=body;box.append(detail);$('feedback').append(box)}
function render(){let s=state,p=s.problem;$('worlds').innerHTML=names.map((n,i)=>'<div class="world '+(i+1===s.level?'active':i+1<s.level?'completed':'')+'"><b>'+(i+1>s.level?'🔒':symbols[i])+'</b>'+(i+1===s.level?'Here':i+1<s.level?'Cleared':'Lv '+(i+1))+'</div>').join('');$('stars').textContent=s.stars+' ✦';$('streak').textContent=s.streak+' 🔥';$('accuracy').textContent=(s.total?Math.round(100*s.correct/s.total):100)+'%';$('leveltitle').textContent=symbols[s.level-1]+' Level '+s.level+': '+names[s.level-1];$('progress').textContent=Math.min(s.success,3)+'/3 to unlock';$('fill').style.width=Math.min(100,s.success/3*100)+'%';$('kind').textContent=p.kind;$('mode').textContent=s.mode==='mc'?'◉ MULTIPLE CHOICE':'✎ WRITTEN ANSWER';$('problem').textContent=p.question;$('answers').innerHTML='';if(s.mode==='mc'){let grid=document.createElement('div');grid.className='choices';s.choices.forEach((text,i)=>{let b=document.createElement('button');b.className='choice'+(i===s.selected?' active':'')+(s.answered&&equivalent(text,p)?' correct':'');b.textContent=text;b.disabled=s.answered;b.onclick=()=>{state.selected=i;grid.querySelectorAll('button').forEach((v,j)=>v.classList.toggle('active',j===i))};grid.append(b)});$('answers').append(grid);$('help').textContent='Choose the expression that multiplies back to the original.'}else{let input=document.createElement('input');input.className='textanswer';input.id='written';input.setAttribute('aria-label','Your factored answer');input.placeholder='Example: (x+2)(x+3)';input.autocomplete='off';input.spellcheck=false;input.disabled=s.answered;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});$('answers').append(input);$('help').textContent='Type factors with parentheses. Either factor order is fine; ^2 means squared.'}$('submit').classList.toggle('hidden',s.answered);$('hint').classList.toggle('hidden',s.answered);$('next').classList.toggle('hidden',!s.answered);$('feedback').innerHTML='';$('winning').classList.toggle('hidden',!s.finished);$('winning').textContent=s.finished?'🏆 You reached the Star Citadel! Keep playing for unlimited challenges.':''}
function submit(){if(state.answered)return;let p=state.problem,answer=state.mode==='mc'?state.choices[state.selected]:$('written').value.trim();if(!answer){message('Choose an answer first','Select a choice or type a factored expression.');return}if(factored(answer,p)){if(state.tries===0){state.correct++;state.stars+=10+Math.min(state.streak,5)*2;state.streak++}else{state.stars+=5;state.streak=0}if(state.tries===0)state.total++;state.success++;state.answered=true;if(state.success>=3){state.success=0;if(state.level<6){state.level++;state.stars+=25}else{state.finished=true;state.stars+=15}}save();render();message('✨ Constellation restored!  '+p.f,p.why)}else{state.tries++;state.streak=0;if(state.tries===1){state.total++;save()}let previous=answer;let hint=state.tries===1?p.hint:p.hint+' '+p.why;if(state.tries>=3)hint+='  A correct factorization is '+p.f+'. Try entering it to continue.';message('Not quite — try again!',hint);if(state.mode==='typed')$('written').value=previous}}
$('submit').onclick=submit;$('hint').onclick=()=>message('💡 Strategy clue',state.problem.hint);$('next').onclick=newProblem;$('reset').onclick=()=>{if(!confirm('Restart your adventure and erase saved progress on this device?'))return;localStorage.removeItem('factorquest_v2');state={level:1,stars:0,streak:0,correct:0,total:0,success:0,finished:false,tries:0,answered:false,selected:-1,problem:null,mode:'mc',choices:[]};newProblem()};newProblem();
</script></body></html>
